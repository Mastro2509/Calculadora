<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notas Académicas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>Gestión de Notas Académicas</h1>
        <p>Sistema de registro y cálculo de promedios</p>
    </header>

    <main class="container">
        <!-- Sección del Formulario -->
        <section class="card">
            <h2>Registrar Estudiante</h2>
            <form id="form-notas">
                <div class="form-group">
                    <label for="nombre">Nombre del estudiante:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="notas-grid">
                    <div class="form-group">
                        <label for="nota1">Nota 1:</label>
                        <input type="number" id="nota1" name="nota1" min="0.0" max="5.0" step="0.1" placeholder="0.0" required>
                    </div>
                    <div class="form-group">
                        <label for="nota2">Nota 2:</label>
                        <input type="number" id="nota2" name="nota2" min="0.0" max="5.0" step="0.1" placeholder="0.0" required>
                    </div>
                    <div class="form-group">
                        <label for="nota3">Nota 3:</label>
                        <input type="number" id="nota3" name="nota3" min="0.0" max="5.0" step="0.1" placeholder="0.0" required>
                    </div>
                    <div class="form-group">
                        <label for="nota4">Nota 4:</label>
                        <input type="number" id="nota4" name="nota4" min="0.0" max="5.0" step="0.1" placeholder="0.0" required>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" id="btn-calcular" class="btn btn-primary">Calcular Promedio</button>
                    <button type="button" id="btn-guardar" class="btn btn-success" disabled>Guardar Registro</button>
                </div>
            </form>
        </section>

        <!-- Área para mostrar resultados -->
        <section class="card result-card" id="area-resultados" style="display: none;">
            <h2>Resultados del Cálculo</h2>
            <div class="result-content">
                <p><strong>Promedio:</strong> <span id="res-promedio">-</span></p>
                <p><strong>Estado:</strong> <span id="res-estado">-</span></p>
                <p><strong>Rendimiento:</strong> <span id="res-rendimiento">-</span></p>
            </div>
        </section>

        <!-- Sección para consultar registros -->
        <section class="card">
            <h2>Registros Almacenados</h2>
            <div class="table-responsive">
                <table id="tabla-registros">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Nota 1</th>
                            <th>Nota 2</th>
                            <th>Nota 3</th>
                            <th>Nota 4</th>
                            <th>Promedio</th>
                            <th>Resultado Cualitativo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Los registros se insertarán aquí dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/Estudiante.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
